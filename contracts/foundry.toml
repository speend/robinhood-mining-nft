[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Arbitrum 系链及其 Blockscout 尚不认 osaka，固定 cancun 保证验证通过
evm_version = "cancun"
# Blockscout 验证器最高支持到 v0.8.36（2026-09 实测），更高版本无法验证源码
solc_version = "0.8.36"
gas_limit = 30000000000
fs_permissions = [{ access = "read", path = "./spike" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

[fmt]
line_length = 120
